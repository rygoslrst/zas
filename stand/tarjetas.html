<style>

    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr);
    box-shadow: 0 8px 40px rgba(27, 16, 48, 0.3);

  .e { background: url(pegatinas.webp) no-repeat; background-size: 500% 400%; }

  .e-pizza { background-position: 50.000% 0.000%; }
  .e-gato { background-position: 75.000% 0.000%; }
  .e-sandia { background-position: 100.000% 0.000%; }
  .e-pelota { background-position: 0.000% 33.333%; }
  .e-cohete { background-position: 25.000% 33.333%; }
  .e-sapo { background-position: 50.000% 33.333%; }
  .e-diamante { background-position: 75.000% 33.333%; }
  .e-trofeo { background-position: 100.000% 33.333%; }
  .e-medalla_bronce { background-position: 0.000% 66.667%; }
  .e-medalla_plata { background-position: 25.000% 66.667%; }
  .e-medalla_oro { background-position: 50.000% 66.667%; }
  .e-dedo { background-position: 75.000% 66.667%; }
  .e-estrella { background-position: 100.000% 66.667%; }
  .e-marciano { background-position: 0.000% 100.000%; }
  .e-corona { background-position: 25.000% 100.000%; }
  .e-rayo { background-position: 50.000% 100.000%; }
  .e-telefono { background-position: 75.000% 100.000%; }
  .e-explosion { background-position: 100.000% 100.000%; }
  .e { display: inline-block; flex: none; }

  /* Cada tarjetita: 105 x 74 mm, con línea de corte punteada */
  .tarjeta {
    position: relative; overflow: hidden; outline: 0.3mm dashed #b9b2cc; outline-offset: -0.15mm;
    background: radial-gradient(ellipse 90% 90% at 30% 40%, #4a2fa3 0%, var(--violeta) 50%, var(--noche) 100%);
    color: var(--crema); display: flex; align-items: center; gap: 4mm; padding: 5mm 6mm;
  }
  .tarjeta .rayos { position: absolute; left: 30%; top: 40%; width: 200mm; height: 200mm; transform: translate(-50%, -50%); }
  .rayos path { fill: rgba(255, 255, 255, 0.07); }
  .tarjeta > * { position: relative; }
  .texto { flex: 1; display: flex; flex-direction: column; gap: 1mm; }
  .logo {
    font-family: var(--display); font-weight: 400; font-size: 23mm; line-height: 0.85; color: var(--oro);
    -webkit-text-stroke: 1mm var(--tinta); paint-order: stroke fill; text-shadow: 0 1.2mm 0 var(--tinta);
    transform: rotate(-6deg); transform-origin: left center; margin-bottom: 1mm;
  }
  .bajada { font-family: var(--display); font-size: 3.8mm; letter-spacing: 0.2mm; line-height: 1.1; }
  .bajada b { font-weight: 400; display: block; font-size: 5.2mm; color: var(--oro);
    -webkit-text-stroke: 0.4mm var(--tinta); paint-order: stroke fill; }
  .voto { font-family: var(--display); font-size: 3.6mm; color: #fff; background: var(--coral); align-self: flex-start;
    padding: 0.4mm 2mm 0.7mm; border: 0.6mm solid var(--tinta); border-radius: 2mm; margin-top: 1mm; transform: rotate(-2deg); }
  .qr-caja {
    width: 42mm; background: #fff; border: 0.9mm solid var(--tinta); border-radius: 3mm; box-shadow: 1mm 1mm 0 var(--tinta);
    padding: 2mm; text-align: center; transform: rotate(2deg);
  }
  .qr-caja svg { width: 100%; height: auto; display: block; }
  .qr-caja p { font-family: var(--display); font-size: 2.9mm; color: var(--tinta); margin-top: 1mm; }
  .deco { position: absolute; }

  /* Versión ahorra tinta */
  body.ahorro .tarjeta { background: #fff; color: var(--tinta); }
  body.ahorro .rayos path { fill: rgba(27, 16, 48, 0.05); }
  body.ahorro .voto { background: #fff; color: var(--coral); }

  .botones { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 5; }
  .botones button { font: 600 15px system-ui, sans-serif; padding: 11px 18px; border-radius: 999px; border: 0; cursor: pointer; background: var(--tinta); color: #fff; }
  .botones button.sec { background: #fff; color: var(--tinta); border: 2px solid var(--tinta); }
  @media screen and (max-width: 880px) { .hoja { zoom: 0.5; } }
  @media screen and (min-width: 881px) and (max-height: 1200px) { .hoja { zoom: 0.72; } }
  @media print { body { background: none; } .hoja { margin: 0; box-shadow: none; zoom: 1 !important; } .botones { display: none; } }
</style>
