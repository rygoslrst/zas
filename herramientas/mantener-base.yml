# Mantiene despierta la base de datos de la tabla de récords.
# PARA ACTIVARLO: copiarlo a .github/workflows/mantener-base.yml y subirlo
# (hace falta el permiso "workflow" de GitHub; ver CLAUDE.md).
# El plan gratis de Supabase pausa el proyecto si pasa 7 días sin consultas:
# esto le hace una consulta cada 2 días desde los servidores de GitHub (sin
# que nadie tenga que acordarse). Se puede correr a mano desde la pestaña
# "Actions" del repositorio → "Mantener despierta la base" → "Run workflow".
# (GitHub apaga estos avisos programados si el repositorio pasa 60 días sin
# cambios: con un commit cualquiera vuelven.)
name: Mantener despierta la base

on:
  schedule:
    - cron: '17 15 */2 * *'     # cada 2 días, a las 15:17 UTC (mediodía en Chile)
  workflow_dispatch:

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Contar partidas (una consulta liviana)
        run: |
          curl -fsS -X POST 'https://eouuvfqpktumfwlebmqz.supabase.co/rest/v1/rpc/contar_partidas' \
            -H 'apikey: sb_publishable_bEC0jMG9Ls2YGHzx2faIcg_xFMQU6WG' \
            -H 'Content-Type: application/json' -d '{}'
